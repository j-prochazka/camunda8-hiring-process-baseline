  <!-- ═══════════════════════════════════════════════
       RELATIONSHIP LINE
       From job_position.id (right edge x=360, y=128)
       To job_application.job_position_id (left edge x=540, y=288)
  ═══════════════════════════════════════════════ -->
  <g id="relationship">
    <!-- Path: right from job_position.id → elbow → down → elbow → left into job_application.job_position_id -->
    <path d="M 360 128 L 450 128 L 450 288 L 540 288"
          fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,3"/>

    <!-- "1" marker on job_position side (single vertical bar) -->
    <line x1="363" y1="121" x2="363" y2="135" stroke="#2563eb" stroke-width="2.5"/>

    <!-- Crow's foot on job_application side (many) -->
    <line x1="537" y1="281" x2="537" y2="295" stroke="#7c3aed" stroke-width="2.5"/>
    <line x1="530" y1="281" x2="537" y2="288" stroke="#7c3aed" stroke-width="2"/>
    <line x1="530" y1="295" x2="537" y2="288" stroke="#7c3aed" stroke-width="2"/>

    <!-- Cardinality labels -->
    <rect x="440" y="198" width="20" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="450" y="211" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">N</text>
    <rect x="366" y="118" width="18" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="375" y="131" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">1</text>
  </g>

  <!-- ═══════════════════════════════════════════════
       LEGEND
  ═══════════════════════════════════════════════ -->
  <g id="legend" transform="translate(20, 488)">
