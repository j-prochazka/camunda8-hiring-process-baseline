    <rect x="55" y="0" width="26" height="14" rx="3" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
    <text x="68" y="11" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">PK</text>
    <text x="84" y="12" font-size="10.5" fill="#64748b">Primary Key</text>

    <rect x="165" y="0" width="22" height="14" rx="3" fill="#ede9fe" stroke="#ddd6fe" stroke-width="0.8"/>
    <text x="176" y="11" text-anchor="middle" font-size="9" font-weight="700" fill="#5b21b6">FK</text>
    <text x="190" y="12" font-size="10.5" fill="#64748b">Foreign Key (logical — no DB constraint)</text>

    <rect x="410" y="0" width="46" height="14" rx="3" fill="#fee2e2" stroke="#fecaca" stroke-width="0.8"/>
    <text x="433" y="11" text-anchor="middle" font-size="8.5" font-weight="600" fill="#991b1b">NOT NULL</text>
    <text x="459" y="12" font-size="10.5" fill="#64748b">Not Null</text>

    <rect x="530" y="0" width="52" height="14" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
    <text x="556" y="11" text-anchor="middle" font-size="8.5" font-weight="600" fill="#065f46">DEFAULT …</text>
    <text x="585" y="12" font-size="10.5" fill="#64748b">Has default value</text>
  </g>

</svg>
