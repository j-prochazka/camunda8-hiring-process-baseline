# =============================================================================
# Application
# =============================================================================
spring.application.name=hr-hiring-app
spring.profiles.active=embedded

# =============================================================================
# H2 Database - File-based (persistent across restarts)
# =============================================================================
spring.datasource.url=jdbc:h2:file:./data/hr-hiring-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Set to "always" to load test data from data.sql, "never" to skip
spring.sql.init.mode=never

# H2 Console (accessible at http://localhost:8089/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# =============================================================================
# Embedded Artemis MQ Broker
# =============================================================================
spring.artemis.mode=embedded
spring.artemis.embedded.enabled=true
spring.artemis.embedded.persistent=true
spring.artemis.embedded.data-directory=./data/artemis
app.jms.topic.hiring-portal=hiring.portal.events

# =============================================================================
# Embedded SMTP (GreenMail)
# =============================================================================
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@localhost
spring.mail.password=test

# =============================================================================
# Server
# =============================================================================
server.port=8089

# =============================================================================
# Camunda 8 Zeebe Client
# =============================================================================
# SaaS
#camunda.client.mode=saas
#camunda.client.auth.client-id=
#camunda.client.auth.client-secret=
#camunda.client.cloud.cluster-id=
#camunda.client.cloud.region=bru-2

# Self Managed
camunda.client.mode=self-managed
camunda.client.auth.method=oidc
camunda.client.auth.client-id=orchestration
camunda.client.auth.client-secret=secret
camunda.client.auth.token-url=http://localhost:18080/auth/realms/camunda-platform/protocol/openid-connect/token
camunda.client.grpc-address=http://localhost:26500
camunda.client.rest-address=http://localhost:8088
camunda.client.tenant-id=demo
